<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .card {
        width: 300px;
        background-color: white;
        margin: 20px;
        border-radius: 20px;
        position: relative;
      }
      .top {
        width: 100%;
        height: 200px;
        background-color: red;
        border-radius: 20px;
      }
      .bottom {
        text-align: center;
        padding: 50px;
        padding-top: 30px;
        padding-bottom: 20px;
      }
      .name {
        font-size: 20px;
        font-weight: bold;
      }
      .position {
        font-size: 15px;
        font-weight: 600;
        margin-top: 10px;
        margin-bottom: 10px;
      }
      .dec {
        font-size: 15px;
        margin-top: 10px;
        margin-bottom: 10px;
        color: rgb(65, 65, 65);
      }
      body {
        background-color: gray;
      }
      .profile {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 50%;
        position: absolute;
        top: 140px;
        right: 110px;
        border: 3px solid white;
      }
      .social {
        width: 30px;
        height: 30px;
        object-fit: cover;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        class="profile"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRd7u4GQIr8YMJNjPKyudtT0vS5KpJt7vOUiMgpHZqo5Z9GN75NFPLipSSY&s=10"
        alt=""
      />
      <div class="top"></div>
      <div class="bottom">
        <p class="name">Soung Rathanak</p>
        <p class="position">Web Front-end</p>
        <hr style="border: 1px solid rgb(207, 6, 6)" />
        <p class="dec">
          I choose web front-end becasue it has high job demand and lets you see
          your coding results instantly.
        </p>
        <div>
          <img
            class="social"
            src="https://img.icons8.com/?size=100&id=118497&format=png&color=000000"
            alt=""
          />
          <img
            class="social"
            src="https://img.icons8.com/?size=100&id=BrU2BBoRXiWq&format=png&color=000000"
            alt=""
          />
          <img
            class="social"
            src="https://img.icons8.com/?size=100&id=114450&format=png&color=000000"
            alt=""
          />
        </div>
      </div>
    </div>
  </body>
</html>
