<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .card{
            width: 250px;
            border: 1px solid rgb(234, 234, 234);
            padding: 15px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgb(234, 234, 234);
        }
        .top{
            width: 100%;
            height: 180px;
            background-color: gray;
            border-radius: 10px;
        }
        .card-body{
            margin-top: 10px;
        }
        .name{
            margin: 10px;
            font-size: 20px;
        }
        .price{
            margin: 0 0 10px;
            font-size: 14px;
        }
        .btn{
            margin-top: 10px;
            padding: 7px 10px;
            background-color: rgb(9, 9, 249);
            border: none;
            border-radius: 5px;
            color: white;
        }
        .img{
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top">
            <img class="img" src="https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcQsg6KXHm6o4SYhPycSwdsJnlGOWCVyIhWBWcg5y8_pki6coDzG" alt="">
        </div>
        <div class="card-body">
            <h3 class name>Girl</h3>
            <p class="price">$100</p>
            <button class="btn">Add to card</button>
        </div>
    </div>
</body>
</html>
