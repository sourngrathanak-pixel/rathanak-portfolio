<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <p>Gender</p>
      <input id="male" type="radio" value="male" name="gender" />
      <label for="male">Male</label> <br />

      <input type="radio" id="female" value="female" name="gender" />
      <label for="female">Female</label> <br />

      <input type="radio" id="other" value="other" name="gender" />
      <label for="other">Other</label>
    </form>
    <br />
    <form>
      <p>Hobbies</p>
      <input type="checkbox" id="read" value="Reading" name="'hobbies" />
      <label for="read">Read</label> <br />

      <input type="checkbox" id="music" value="Music" name="hobbies" />
      <label for="music">Music</label> <br />

      <input type="checkbox" id="sport" value="Sport" name="hobbies" />
      <label for="sport">Sport</label>
    </form>
    <br />
    <form action="">
      <select>
        <option disabled selected>Choose your country</option>
        <option value="">Cambodia</option>
        <option value="">Vietnam</option>
        <option value="">Laos</option>
      </select>
    </form>
    <br />
    <form action="">
      <textarea style="width: 400px" id="" rows="5" cols="4"></textarea>
    </form>
    <br />
    <form action="">
      <select name="" id="">
        <optgroup label="Web development">
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="js">Javascript</option>
        </optgroup>
        <optgroup label="Mobile">
          <option value="">Java</option>
          <option value="">Kotlin</option>
          <option value="">Swift</option>
        </optgroup>
      </select>
    </form>
  </body>
</html>
