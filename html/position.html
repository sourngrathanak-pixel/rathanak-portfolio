<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            width: 500px;
            height: 500px;
            background-color: red;
            position: relative;
            bottom: 20px;
            right: 0px;
        }
        .inner{
            width: 200px;
            height: 200px;
            background-color: gray;
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .fixed{
            width: 100px;
            height: 100px;
            background-color: blue;
            position: fixed;
            right: 0;
        }
        body{
            height: 2000px;
        }
        .sticky{
            width: 100px;
            height: 100px;
            background-color: green;
            position: sticky;
            top: 0px;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hello</h1>
        <div class="inner"></div>
        <div class="fixed"></div>
        <div class="sticky"></div>
    </div>
</body>
</html>
