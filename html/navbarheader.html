<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #0b0f19; 
        padding: 30px;
      }
      .header-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #ffffff;
        padding: 14px 28px;
        border-radius: 20px; 
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); 
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 20px;
        font-weight: 700;
        color: #111827;
        cursor: pointer;
      }
      .logo .icon-leaf {
        color: #38b000; 
        stroke-width: 2.5;
      }
      .nav-links {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .nav-links a {
        text-decoration: none;
        color: #4b5563; 
        font-size: 15px;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: #111827; 
      }
      .btn-cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background-color: #38b000; 
        color: #ffffff;
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        padding: 12px 24px;
        border-radius: 12px;
        transition:
        background-color 0.2s ease,
        transform 0.1s ease;
      }
      .btn-cta svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.5;
      }
      .btn-cta:hover {
        background-color: #2d8c00; 
      }

      .btn-cta:active {
        transform: scale(0.98); 
      }
    </style>
  </head>
  <body>
   <header class="header-container">
    <nav class="navbar">
      <div class="logo">
        <img width="20px" src="https://img.magnific.com/free-vector/leaf-hand-drawn_78370-6460.jpg?semt=ais_hybrid&w=740&q=80" alt="">
        <span>Greenova</span>
      </div>

      <ul class="nav-links">
        <li><a href="#home" class="active">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#blog">Blog</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <div class="nav-cta">
        <a href="#get-started" class="btn-cta">
          Get Started
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </nav>
  </header>
  </body>
</html>
