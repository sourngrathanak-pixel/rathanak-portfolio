<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .section{
            width: 100vw;
            height: 100vh;
            background-color: red;
        }
        .section1{
            background-color: red;
        }
        .section2{
            padding-top: 200px;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-image: url(https://images.unsplash.com/photo-1631631480669-535cc43f2327?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8YmFja2dyb3VuZCUyMGltYWdlfGVufDB8fDB8fHww);
        }
        .section3{
            background-color: blue;
        }
        h1{
            text-align: center;
            font-size: 100px;
        }
    </style>
</head>
<body>
    <section class="section section1"></section>
    <section class="section section2">
        <h1>Tree</h1>
    </section>
    <section class="section section3"></section>
</body>
</html>
